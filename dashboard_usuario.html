<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard Usuario
    </title>

    <link
        rel="stylesheet"
        href="./css/style_dashboard.css">

</head>

<body>

    <header class="dashboard-header">

        <h1>
            Bienvenido a SportClub
        </h1>

    </header>

    <main class="dashboard-contenido">

    <div class="dashboard-card">

        <h2>
            Mi Perfil
        </h2>

        <p>
            Revisa y actualiza tu información personal.
        </p>

    </div>

    <div class="dashboard-card">

        <h2>
            Mi Plan
        </h2>

        <p>
            Consulta el plan deportivo que tienes contratado.
        </p>

    </div>

    <div class="dashboard-card">

        <h2>
            Actividades
        </h2>

        <p>
            Explora las actividades disponibles del club.
        </p>

    </div>

    <div class="dashboard-card">

        <h2>
            Objetivos
        </h2>

        <p>
            Haz seguimiento de tus metas deportivas.
        </p>

    </div>

</main>

</body>

</html>
