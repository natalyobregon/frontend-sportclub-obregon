<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard Coach
    </title>

    <link
        rel="stylesheet"
        href="./css/style_dashboard.css">

</head>

<body>

    <header class="dashboard-header">

        <h1>
            Bienvenido Coach
        </h1>

    </header>

    <main class="dashboard-contenido">

        <div class="dashboard-card">

            <h2>
                Mis Alumnos
            </h2>

            <p>
                Visualiza los alumnos asignados.
            </p>

        </div>

        <div class="dashboard-card">

            <h2>
                Rutinas
            </h2>

            <p>
                Gestiona planes de entrenamiento.
            </p>

        </div>

        <div class="dashboard-card">

            <h2>
                Horarios
            </h2>

            <p>
                Revisa las clases programadas.
            </p>

        </div>

        <div class="dashboard-card">

            <h2>
                Seguimiento
            </h2>

            <p>
                Controla el progreso de los alumnos.
            </p>

        </div>

    </main>

</body>

</html>
