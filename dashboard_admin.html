<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard Administrador
    </title>

    <link
        rel="stylesheet"
        href="./css/style_dashboard.css">

</head>

<body>

    <header class="dashboard-header">

        <h1>
            Bienvenido Administrador
        </h1>

    </header>

    <main class="dashboard-contenido">

        <div class="dashboard-card">

            <h2>
                Usuarios
            </h2>

            <p>
                Gestiona los usuarios registrados en el sistema.
            </p>

        </div>

        <div class="dashboard-card">

            <h2>
                Planes
            </h2>

            <p>
                Administra los planes disponibles del club.
            </p>

        </div>

        <div class="dashboard-card">

            <h2>
                Actividades
            </h2>

            <p>
                Gestiona las actividades deportivas del club.
            </p>

        </div>

        <div class="dashboard-card">

            <h2>
                Reportes
            </h2>

            <p>
                Consulta estadísticas e información general.
            </p>

        </div>

    </main>

</body>

</html>
