<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SportClub</title>
    <link rel="stylesheet" href="../css/style_login.css">
</head>

<body>

    <main class="contenedor">

        <header class="logo">
            <img src="../assets/img/logo.png" alt="Logo empresa">
        </header>

        <h2>Iniciar Sesión</h2>

        <div class="mensaje-error"></div>
        <div class="mensaje-exito"></div>

        <form id="loginForm">

            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" placeholder="Ingresa tu correo">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña">
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>

        </form>

        <div class="links">
            <a href="recuperacion.html">Recuperar contraseña</a>
            <a href="registro.html">Registrarse</a>
        </div>

    </main>
    <script src="../js/login.js"></script>
</body>

</html>
