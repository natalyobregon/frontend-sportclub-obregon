<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Club Deportivo</title>
    <link rel="stylesheet" href="../css/style_dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        // Bloque de seguridad
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="bg-light">

    <header class="dashboard-header bg-dark text-white p-3 d-flex justify-content-between align-items-center">
        <div class="logo">
            <img src="../assets/img/logo.png" alt="Logo SportClub" style="max-height: 50px;">
        </div>
        <nav class="dashboard-nav">
            <a href="dashboard_usuario.html" class="text-white me-3 text-decoration-none">Inicio</a>
            <a href="#" class="text-white me-3 text-decoration-none fw-bold">Mi Perfil</a>
            <a href="login.html" class="fw-bold" style="color: #c5221f; text-decoration: none;" onclick="localStorage.clear();">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 800px;">
        
        <div class="mensaje-error alert alert-danger" style="display: none;" role="alert"></div>
        <div class="mensaje-exito alert alert-success" style="display: none;" role="alert"></div>

        <div class="card p-4 mb-4 shadow-sm">
            <h2>Mi Perfil</h2>
            <p class="text-muted">Gestiona tu información personal y preferencias de cuenta</p>
        </div>

        <div class="card p-4 mb-4 shadow-sm">
            <h4 class="mb-3">Información Personal</h4>
            <form id="perfilForm" class="row g-3">
                <div class="col-md-12">
                    <label class="form-label">Nombre Completo *</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email (No editable) *</label>
                    <input type="email" id="correo" class="form-control" readonly disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Rol (No editable) *</label>
                    <input type="text" id="rol" class="form-control" readonly disabled>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" id="fecha_nacimiento" class="form-control">
                </div>
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-success">💾 Guardar Cambios</button>
                </div>
            </form>
        </div>

        <div class="card p-4 shadow-sm">
            <h4 class="mb-3 text-danger">Seguridad y Contraseña</h4>
            <form id="passwordForm" class="row g-3">
                <div class="col-md-12">
                    <label class="form-label">Contraseña Actual *</label>
                    <input type="password" id="password_actual" class="form-control" placeholder="Ingresa tu contraseña actual">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nueva Contraseña *</label>
                    <input type="password" id="password_nueva" class="form-control" placeholder="Mínimo 8 caracteres">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirmar Nueva Contraseña *</label>
                    <input type="password" id="password_confirmar" class="form-control" placeholder="Repite la nueva contraseña">
                </div>
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-danger">🔒 Actualizar Contraseña</button>
                </div>
            </form>
        </div>

    </main>

    <script src="../js/perfil.js"></script>
</body>
</html>
