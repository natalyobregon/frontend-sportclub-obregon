<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registro SportClub</title>

    <link
        rel="stylesheet"
        href="../css/style_registro.css">

</head>

<body>

    <main class="contenedor">

        <header class="logo">

            <img
                src="../assets/img/logo.png"
                alt="Logo empresa">

            <h2>
                Crear cuenta
            </h2>

        </header>

        <div class="mensaje-error"></div>
        <div class="mensaje-exito"></div>

        <form id="registroForm" class="formulario">

            <div class="campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ingresa tu nombre">

            </div>

            <div class="campo">

                <label for="fecha">
                    Fecha de nacimiento
                </label>

                <input
                    type="date"
                    id="fecha">

            </div>

            <div class="campo">

                <label for="correo">
                    Correo
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo">

            </div>

            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Crea una contraseña">

            </div>

            <div class="campo">

                <label for="confirmar-password">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar-password"
                    placeholder="Repite tu contraseña">

            </div>

            <div class="campo">

                <label>
                    ¿Practicas deporte?
                </label>

                <div class="opciones">

                    <label>
                        <input
                            type="radio"
                            name="deporte">
                        Sí
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="deporte">
                        No
                    </label>

                </div>

            </div>

            <div class="campo">

                <label for="actividad">
                    Actividad de interés
                </label>

                <select id="actividad">

                    <option>
                        Selecciona una actividad
                    </option>

                    <option>
                        Musculación
                    </option>

                    <option>
                        Cardio
                    </option>

                    <option>
                        Yoga
                    </option>

                    <option>
                        Entrenamiento funcional
                    </option>   

                    <option>
                        Pilates     
                    </option>   

                </select>

            </div>

            <div class="campo">

                <label for="objetivo">
                    Objetivo
                </label>

                <select id="objetivo">

                    <option>
                        Selecciona un objetivo
                    </option>

                    <option>
                        Bajar de peso
                    </option>

                    <option>
                        Mantenerse activo
                    </option>

                    <option>
                        Ganar masa muscular
                    </option>

                    <option>
                        Mejorar condición física
                    </option>

                </select>

            </div>

            <button type="submit">

                Registrarme

            </button>

            <div class="links">

                <a href="login.html">

                    Volver al Login

                </a>

            </div>

        </form>

    </main>

    <script src="../js/registro.js"></script>
</body>

</html>
