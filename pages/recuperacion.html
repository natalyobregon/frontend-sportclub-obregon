<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Contraseña</title>

    <link rel="stylesheet" href="../css/style_login.css">

</head>

<body>

    <main class="contenedor">

        <header class="logo">

            <img src="../assets/img/logo.png" alt="Logo empresa">

        </header>

        <h2>Recuperar Contraseña</h2>

        <div class="mensaje-error"></div>

        <div class="mensaje-exito"></div>

        <form id="recuperacionForm">

            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="id-correo" placeholder="Ingresa tu correo">
            </div>

            <button type="submit" class="btn-login">
                Enviar
            </button>

        </form>
        
        <div class="links">

            <a href="login.html">Volver al Login</a>

        </div>

    </main>

    <script>

    const form = document.getElementById("recuperacionForm");
    const correo = document.getElementById("id-correo");

    const errorDiv = document.querySelector(".mensaje-error");
    const exitoDiv = document.querySelector(".mensaje-exito");

    form.addEventListener("submit", (e) => {

        e.preventDefault();

        errorDiv.style.display = "none";
        exitoDiv.style.display = "none";

        const email = correo.value.trim();

        if (!email) {
            errorDiv.textContent = "Debes ingresar un correo.";
            errorDiv.style.display = "block";
            return;
        }

        exitoDiv.textContent =
        "Se ha enviado un enlace de recuperación al correo ingresado.";

        exitoDiv.style.display = "block";

    });

    </script>

</body>

</html>
