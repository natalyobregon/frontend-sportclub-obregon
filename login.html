<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login SportClub</title>

<link rel="stylesheet"
href="./css/style_login.css">

</head>

<body>

<main class="contenedor">

    <header class="logo">

        <h1>SportClub</h1>

    </header>

        <h2>Login</h2>

        <div class="campo">

            <label for="correo">
                 Correo
            </label>

            <input
            type="email"
            id="correo"
            placeholder="Ingresa tu correo">

        </div>
        <div class="campo">

        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña">

        </div>

        <button>

        Iniciar sesión

        </button>

        <div class="links">

        <a href="#">
            Recuperar contraseña
        </a>

        <a href="#">
            Registrarse
        </a>

    </div>

</main>

</body>

</html>
