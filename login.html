<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login SportClub</title>

<link rel="stylesheet" href="./css/style_login.css">

</head>

<body>

<main class="contenedor">

    <header class="logo">
        <img src="./img/logo.png" alt="Logo empresa">
    </header>

    <h2>Iniciar Sesión</h2>

    <!-- MENSAJES (REQUISITO PAUTA) -->
    <div class="mensaje-error"></div>
    <div class="mensaje-exito"></div>

    <form>

        <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="Ingresa tu correo">
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña">
        </div>

        <!-- BOTÓN CORRECTO -->
        <button type="button" onclick="location.href='dashboard_usuario.html'" class="btn-login">
            Iniciar Sesión
        </button>

    </form>

    <div class="links">

        <a href="recuperacion.html">
            Recuperar contraseña
        </a>

        <a href="registro.html">
            Registrarse
        </a>

    </div>

    <div class="accesos-rapidos">

    <a href="dashboard_usuario.html">Perfil Alumno</a>
    <a href="dashboard_coach.html">Perfil Entrenador</a>
    <a href="dashboard_admin.html">Perfil Administrador</a>

    </div>

</main>

</body>

</html>
